<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Background Remover Tool</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: 080f13;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
      width: 90%;
      max-width: 500px;
    }

    h1 {
      margin-bottom: 20px;
      color: #0072ff;
    }

    input[type="file"] {
      margin: 15px 0;
      padding: 10px;
      border: 2px dashed #0072ff;
      border-radius: 10px;
      width: 100%;
      cursor: pointer;
      background-color: #f9f9f9;
    }

    button {
      background-color: #0072ff;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #005fcc;
    }

    #result {
      margin-top: 25px;
    }

    #result img {
      max-width: 100%;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    #downloadBtn {
      margin-top: 20px;
      display: inline-block;
      background-color: #28a745;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    #downloadBtn:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Background Remover</h1>
    <input type="file" id="imageInput" accept="image/*" />
    <button onclick="removeBackground()">Remove Background</button>
    <div id="result"></div>
    <a id="downloadBtn" style="display:none;" download="no-bg.png">⬇️ Download Image</a>
  </div>

  <script>
    async function removeBackground() {
      const input = document.getElementById('imageInput');
      const file = input.files[0];

      if (!file) {
        alert('Please select an image first.');
        return;
      }

      const formData = new FormData();
      formData.append('image_file', file);
      formData.append('size', 'auto');

      const response = await fetch('https://api.remove.bg/v1.0/removebg', {
        method: 'POST',
        headers: {
          'X-Api-Key': 'p5ffJzZRtJA9WR72AsmMuP6U' // 🔑 Replace with your actual API key
        },
        body: formData
      });

      if (!response.ok) {
        alert('Background removal failed. Check your API key or image.');
        return;
      }

      const blob = await response.blob();
      const url = URL.createObjectURL(blob);

      document.getElementById('result').innerHTML = `<img src="${url}" alt="Background Removed Image" />`;

      const downloadBtn = document.getElementById('downloadBtn');
      downloadBtn.href = url;
      downloadBtn.style.display = 'inline-block';
    }
  </script>
</body>
</html>
